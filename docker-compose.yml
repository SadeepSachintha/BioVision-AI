version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biovision-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - biovision-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    container_name: biovision-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    networks:
      - biovision-net

volumes:
  mlflow_data:

networks:
  biovision-net:
    driver: bridge
